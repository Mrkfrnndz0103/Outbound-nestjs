services:
  api:
    build: ./backend
    image: soc5-outbound-api:local
    env_file: ./backend/.env
    expose: ["8000"]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
  scheduler:
    image: soc5-outbound-api:local
    env_file: ./backend/.env
    command: php artisan schedule:work
    init: true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the root .env before building the web image}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in the root .env before building the web image}
    # The named Cloudflare Tunnel targets the production frontend origin on
    # port 4173. NGINX inside this image serves the built /app/dist output.
    ports: ["127.0.0.1:4173:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
