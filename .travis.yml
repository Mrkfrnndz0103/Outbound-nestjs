language: minimal
stages:
  - test
  - name: publish-production
    if: tag IS present AND env(PRODUCTION_DEPLOY_ENABLED) = true
jobs:
  include:
    - name: "Frontend"
      language: node_js
      dist: jammy
      node_js: "22"
      env:
        - PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright
      addons:
        apt:
          packages:
            - fonts-liberation
            - fonts-noto-color-emoji
            - libasound2
            - libatk-bridge2.0-0
            - libatk1.0-0
            - libatspi2.0-0
            - libcups2
            - libdbus-1-3
            - libdrm2
            - libgbm1
            - libglib2.0-0
            - libnspr4
            - libnss3
            - libpango-1.0-0
            - libx11-6
            - libx11-xcb1
            - libxcb1
            - libxcomposite1
            - libxdamage1
            - libxext6
            - libxfixes3
            - libxrandr2
            - libxshmfence1
            - xvfb
      cache:
        npm: true
        directories:
          - frontend/.npm
          - $HOME/.cache/ms-playwright
      before_script:
        - cd frontend
        - npm ci --cache .npm --prefer-offline
      script:
        - npm run check:robots
        - npm run check:encoding
        - npm run lint
        - npm run lint:a11y
        - npm run format:check
        - npm test
        - test -d "$PLAYWRIGHT_BROWSERS_PATH" && ls "$PLAYWRIGHT_BROWSERS_PATH"/chromium-* >/dev/null 2>&1 || npx playwright install chromium
        - npm run test:e2e
        - npm run build

    - name: "Edge Functions"
      language: minimal
      dist: jammy
      env:
        - DENO_INSTALL=$HOME/.deno
      cache:
        directories:
          - $HOME/.deno
          - $HOME/.cache/deno
      before_script:
        - test -x "$DENO_INSTALL/bin/deno" || curl -fsSL https://deno.land/install.sh | sh
        - export PATH="$DENO_INSTALL/bin:$PATH"
      script:
        - deno check supabase/functions/sync-clusters/index.ts supabase/functions/sync-intraday/index.ts
        - deno test --allow-env supabase/functions/sync-clusters/index_test.ts supabase/functions/sync-intraday/index_test.ts

    - name: "Deployment Config"
      language: node_js
      dist: jammy
      node_js: "22"
      services:
        - docker
      script:
        - docker compose version
        - SUPABASE_URL=https://staging.invalid SUPABASE_PUBLISHABLE_KEY=staging-publishable-key docker compose config -q
        - SUPABASE_URL=https://staging.invalid SUPABASE_PUBLISHABLE_KEY=staging-publishable-key docker compose build --pull api-nest web
        - bash scripts/ci/verify-release-static.sh

    - name: "Publish and Deploy Production"
      if: tag IS present AND env(PRODUCTION_DEPLOY_ENABLED) = true
      stage: publish-production
      language: minimal
      dist: jammy
      services:
        - docker
      addons:
        apt:
          packages:
            - awscli
            - jq
      script:
        - bash scripts/deploy/deploy-aws-ecs.sh
