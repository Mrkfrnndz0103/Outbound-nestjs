services:
  api-nest:
    build: ./backend-nest
    image: soc5-outbound-api-nest:local
    env_file: ./backend-nest/.env
    expose: ["3001"]
    init: true
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3001/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the root .env before building the web image}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in the root .env before building the web image}
    # The named Cloudflare Tunnel targets the production frontend origin on
    # port 4173. NGINX inside this image serves the built /app/dist output.
    ports: ["127.0.0.1:4173:80"]
    depends_on:
      api-nest:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
