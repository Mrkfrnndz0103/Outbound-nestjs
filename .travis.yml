language: minimal
jobs:
  include:
    - name: "Frontend"
      language: node_js
      dist: jammy
      node_js: "22"
      env:
        - PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright
      addons:
        apt:
          packages:
            - fonts-liberation
            - fonts-noto-color-emoji
            - libasound2
            - libatk-bridge2.0-0
            - libatk1.0-0
            - libatspi2.0-0
            - libcups2
            - libdbus-1-3
            - libdrm2
            - libgbm1
            - libglib2.0-0
            - libnspr4
            - libnss3
            - libpango-1.0-0
            - libx11-6
            - libx11-xcb1
            - libxcb1
            - libxcomposite1
            - libxdamage1
            - libxext6
            - libxfixes3
            - libxrandr2
            - libxshmfence1
            - xvfb
      cache:
        npm: true
        directories:
          - frontend/.npm
          - $HOME/.cache/ms-playwright
      before_script:
        - cd frontend
        - npm ci --cache .npm --prefer-offline
      script:
        - npm run check:robots
        - npm run check:encoding
        - npm run lint
        - npm run lint:a11y
        - npm run format:check
        - npm test
        - test -d "$PLAYWRIGHT_BROWSERS_PATH" && ls "$PLAYWRIGHT_BROWSERS_PATH"/chromium-* >/dev/null 2>&1 || npx playwright install chromium
        - npm run test:e2e
        - npm run build

    - name: "Backend"
      language: php
      dist: jammy
      php: "8.3"
      cache:
        directories:
          - $HOME/.cache/composer
      before_script:
        - sudo apt-get update
        - sudo apt-get install -y --no-install-recommends unzip libxml2-dev libonig-dev libsqlite3-dev
        - cd backend
        - cp .env.example .env
        - mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
        - composer install --no-interaction --prefer-dist --no-progress --no-scripts
        - php artisan key:generate --force
        - composer dump-autoload --optimize
      script:
        - composer validate --no-check-publish
        - composer audit --locked --no-dev --abandoned=ignore
        - vendor/bin/pint --test
        - php artisan test --fail-on-skipped --exclude-group=postgres

    - name: "Backend PostgreSQL"
      if: type = pull_request OR branch = main
      language: php
      dist: jammy
      php: "8.3"
      cache:
        directories:
          - $HOME/.cache/composer
      services:
        - postgresql
      env: >-
        POSTGRES_TESTS=1 DB_CONNECTION=pgsql DB_HOST=127.0.0.1
        DB_PORT=5432 DB_DATABASE=postgres DB_USERNAME=postgres
        DB_PASSWORD='' DB_SSLMODE=disable
      before_script:
        - sudo apt-get update
        - sudo apt-get install -y --no-install-recommends unzip libxml2-dev libonig-dev libpq-dev
        - cd backend
        - cp .env.example .env
        - mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
        - composer install --no-interaction --prefer-dist --no-progress --no-scripts
        - php artisan key:generate --force
        - composer dump-autoload --optimize
      script:
        - php artisan migrate:install
        - php artisan migrate --path=database/migrations/2026_09_19_024934_create_idempotency_keys_table.php --force --no-interaction
        - php artisan migrate --path=database/migrations/2026_09_20_000000_create_user_event_retries_table.php --force --no-interaction
        - php artisan migrate --path=database/migrations/2026_09_21_000000_add_status_to_user_event_retries_table.php --force --no-interaction
        - php artisan migrate --path=database/migrations/2026_09_25_000000_create_queue_support_tables.php --force --no-interaction
        - php artisan migrate --path=database/migrations/2026_10_13_000003_create_workflow_outbox.php --force --no-interaction
        - php artisan test --group=postgres --fail-on-skipped

    - name: "Backend migration chain"
      if: type = pull_request OR branch = main
      language: php
      dist: jammy
      php: "8.3"
      cache:
        directories:
          - $HOME/.cache/composer
      services:
        - postgresql
      env: >-
        DB_CONNECTION=pgsql DB_HOST=127.0.0.1 DB_PORT=5432 DB_DATABASE=postgres
        DB_USERNAME=postgres DB_PASSWORD='' DB_SSLMODE=disable
        PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=''
      before_script:
        - sudo apt-get update
        - sudo apt-get install -y --no-install-recommends unzip libxml2-dev libonig-dev libpq-dev postgresql-client
        - cd backend
        - cp .env.example .env
        - mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
        - composer install --no-interaction --prefer-dist --no-progress --no-scripts
        - php artisan key:generate --force
        - composer dump-autoload --optimize
      script:
        - bash "$TRAVIS_BUILD_DIR/scripts/ci/apply-postgres-migration-chain.sh"

    - name: "Edge Functions"
      language: minimal
      dist: jammy
      env:
        - DENO_INSTALL=$HOME/.deno
      cache:
        directories:
          - $HOME/.deno
          - $HOME/.cache/deno
      before_script:
        - test -x "$DENO_INSTALL/bin/deno" || curl -fsSL https://deno.land/install.sh | sh
        - export PATH="$DENO_INSTALL/bin:$PATH"
      script:
        - deno check supabase/functions/sync-clusters/index.ts supabase/functions/sync-intraday/index.ts
        - deno test --allow-env supabase/functions/sync-clusters/index_test.ts supabase/functions/sync-intraday/index_test.ts

    - name: "Deployment Config"
      language: node_js
      dist: jammy
      node_js: "22"
      services:
        - docker
      addons:
        apt:
          packages:
            - php-cli
      before_script:
        - |
          installer="$(mktemp)"
          expected="$(curl -fsSL https://composer.github.io/installer.sig)"
          curl -fsSL https://getcomposer.org/installer -o "$installer"
          actual="$(php -r 'echo hash_file("sha384", $argv[1]);' "$installer")"
          test "$expected" = "$actual"
          sudo php "$installer" --install-dir=/usr/local/bin --filename=composer
          rm -f "$installer"
      script:
        - cp backend/.env.staging.example backend/.env
        - docker compose version
        - SUPABASE_URL=https://staging.invalid SUPABASE_PUBLISHABLE_KEY=staging-publishable-key docker compose config -q
        - SUPABASE_URL=https://staging.invalid SUPABASE_PUBLISHABLE_KEY=staging-publishable-key docker compose build --pull api web
        - bash scripts/ci/verify-release-static.sh

    - name: "Release Acceptance"
      if: tag IS present
      language: node_js
      dist: jammy
      node_js: "22"
      env:
        - PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright
      cache:
        npm: true
        directories:
          - $HOME/.cache/ms-playwright
      before_script:
        - npm ci --prefer-offline
        - npx playwright install --with-deps chromium
      script:
        - bash scripts/ci/require-release-acceptance.sh
