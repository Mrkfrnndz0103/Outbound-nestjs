geo $trusted_ingress {
  default 0;
  127.0.0.1 1;
  ::1 1;
  10.0.0.0/8 1;
  172.16.0.0/12 1;
  192.168.0.0/16 1;
}

map $http_x_forwarded_proto $candidate_forwarded_proto {
  default "";
  ~^https$ https;
  ~^http$ http;
}

map "$trusted_ingress:$candidate_forwarded_proto" $external_forwarded_proto {
  default $scheme;
  "1:https" https;
  "1:http" http;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://static.cdn.haiserve.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://static.cdn.haiserve.com; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co wss://*.supabase.in https://static.cdn.haiserve.com https://openapi.seatalk.io" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location / { try_files $uri /index.html; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /auth/seatalk/callback { proxy_pass http://api-nest:3001/auth/seatalk/callback; proxy_set_header Host $host; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto $external_forwarded_proto; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /api/ { proxy_pass http://api-nest:3001/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto $external_forwarded_proto; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /up { proxy_pass http://api-nest:3001/up; proxy_set_header Host $host; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto $external_forwarded_proto; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
