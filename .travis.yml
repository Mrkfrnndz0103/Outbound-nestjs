language: minimal
jobs:
  include:
    - name: "Frontend"
      language: node_js
      dist: jammy
      node_js: "22"
      env:
        - PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright
      addons:
        apt:
          packages:
            - fonts-liberation
            - fonts-noto-color-emoji
            - libasound2
            - libatk-bridge2.0-0
            - libatk1.0-0
            - libatspi2.0-0
            - libcups2
            - libdbus-1-3
            - libdrm2
            - libgbm1
            - libglib2.0-0
            - libnspr4
            - libnss3
            - libpango-1.0-0
            - libx11-6
            - libx11-xcb1
            - libxcb1
            - libxcomposite1
            - libxdamage1
            - libxext6
            - libxfixes3
            - libxrandr2
            - libxshmfence1
            - xvfb
      cache:
        npm: true
        directories:
          - frontend/.npm
          - $HOME/.cache/ms-playwright
      before_script:
        - cd frontend
        - npm ci --cache .npm --prefer-offline
      script:
        - npm run check:robots
        - npm run check:encoding
        - npm run lint
        - npm run lint:a11y
        - npm run format:check
        - npm test
        - |
          if [ "$TRAVIS_PULL_REQUEST" = "false" ]; then
            test -d "$PLAYWRIGHT_BROWSERS_PATH" && ls "$PLAYWRIGHT_BROWSERS_PATH"/chromium-* >/dev/null 2>&1 || npx playwright install chromium
            npm run test:e2e
          else
            echo "Skipping E2E tests for pull request validation"
          fi
        - npm run build

    - name: "Backend"
      language: php
      dist: jammy
      php: "8.3"
      cache:
        directories:
          - $HOME/.cache/composer
      before_script:
        - sudo apt-get update
        - sudo apt-get install -y --no-install-recommends unzip libxml2-dev libonig-dev libsqlite3-dev
        - cd backend
        - cp .env.example .env
        - mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
        - composer install --no-interaction --prefer-dist --no-progress --no-scripts
        - php artisan key:generate --force
        - composer dump-autoload --optimize
      script:
        - composer validate --no-check-publish
        - composer audit --locked --no-dev --abandoned=ignore
        - vendor/bin/pint --test
        - php artisan test --fail-on-skipped --exclude-group=postgres

    - name: "Backend PostgreSQL"
      if: type != pull_request
      language: php
      dist: jammy
      php: "8.3"
      cache:
        directories:
          - $HOME/.cache/composer
      services:
        - postgresql
      env: >-
        POSTGRES_TESTS=1 DB_CONNECTION=pgsql DB_HOST=127.0.0.1
        DB_PORT=5432 DB_DATABASE=postgres DB_USERNAME=postgres
        DB_PASSWORD='' DB_SSLMODE=disable
      before_script:
        - sudo apt-get update
        - sudo apt-get install -y --no-install-recommends unzip libxml2-dev libonig-dev libpq-dev
        - cd backend
        - cp .env.example .env
        - mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
        - composer install --no-interaction --prefer-dist --no-progress --no-scripts
        - php artisan key:generate --force
        - composer dump-autoload --optimize
      script:
        - php artisan test --group=postgres --fail-on-skipped

    - name: "Edge Functions"
      language: minimal
      dist: jammy
      env:
        - DENO_INSTALL=$HOME/.deno
      cache:
        directories:
          - $HOME/.deno
          - $HOME/.cache/deno
      before_script:
        - test -x "$DENO_INSTALL/bin/deno" || curl -fsSL https://deno.land/install.sh | sh
        - export PATH="$DENO_INSTALL/bin:$PATH"
      script:
        - deno check supabase/functions/sync-clusters/index.ts supabase/functions/sync-intraday/index.ts
        - deno test --allow-env supabase/functions/sync-clusters/index_test.ts supabase/functions/sync-intraday/index_test.ts

    - name: "Deployment Config"
      language: minimal
      dist: jammy
      script:
        - cp backend/.env.staging.example backend/.env
        - SUPABASE_URL=https://staging.invalid SUPABASE_PUBLISHABLE_KEY=staging-publishable-key docker compose config -q
        - SUPABASE_URL=https://staging.invalid SUPABASE_PUBLISHABLE_KEY=staging-publishable-key docker compose build --pull api web
        - bash scripts/ci/verify-release-static.sh

    - name: "Release Acceptance"
      if: tag IS present
      language: minimal
      dist: jammy
      script:
        - bash scripts/ci/require-release-acceptance.sh
